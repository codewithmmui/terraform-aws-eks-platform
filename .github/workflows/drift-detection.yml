name: Drift Detection
on: { schedule: [{ cron: "23 5 * * 1-5" }], workflow_dispatch: { inputs: { environment: { type: choice, options: [dev, staging, prod], default: dev } } } }
permissions: { contents: read, id-token: write, issues: write }
jobs:
  drift:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v6
        with: { role-to-assume: "${{ vars.AWS_PLAN_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - id: plan
        continue-on-error: true
        env: { TF_VARS_JSON: "${{ secrets.TF_VARS_JSON }}" }
        run: printf '%s' "$TF_VARS_JSON" > terraform.auto.tfvars.json && terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=eks-platform/${{ inputs.environment || 'dev' }}/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true" && terraform plan -detailed-exitcode -no-color
        working-directory: terraform/environments/${{ inputs.environment || 'dev' }}
      - if: steps.plan.outcome == 'failure'
        run: echo "Drift or plan failure detected; inspect this workflow run." && exit 1
