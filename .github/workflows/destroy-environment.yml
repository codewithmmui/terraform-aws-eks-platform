name: Destroy Environment
on: { workflow_dispatch: { inputs: { environment: { type: choice, required: true, options: [dev, staging, prod] }, confirmation: { description: "Type DESTROY-<ENV> (for example DESTROY-dev)", required: true, type: string } } } }
permissions: { contents: read, id-token: write }
jobs:
  destroy:
    if: inputs.confirmation == format('DESTROY-{0}', inputs.environment)
    runs-on: ubuntu-latest
    environment: destroy-${{ inputs.environment }}
    concurrency: terraform-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_APPLY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - run: printf '%s' '${{ secrets.TF_VARS_JSON }}' > terraform.auto.tfvars.json
        working-directory: terraform/environments/${{ inputs.environment }}
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=eks-platform/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true" && terraform plan -destroy -out=destroy.tfplan && terraform apply destroy.tfplan
        working-directory: terraform/environments/${{ inputs.environment }}
