name: Terraform Apply
on: { workflow_dispatch: { inputs: { environment: { type: choice, required: true, options: [dev, staging, prod] }, confirmation: { description: "Type APPLY", required: true, type: string } } } }
permissions: { contents: read, id-token: write }
jobs:
  apply:
    if: inputs.confirmation == 'APPLY'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: terraform-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.12.2" }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_APPLY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}", role-session-name: gha-terraform-apply }
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=eks-platform/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
        working-directory: terraform/environments/${{ inputs.environment }}
      - run: printf '%s' '${{ secrets.TF_VARS_JSON }}' > terraform.auto.tfvars.json
        working-directory: terraform/environments/${{ inputs.environment }}
      - run: terraform plan -input=false -out=tfplan
        working-directory: terraform/environments/${{ inputs.environment }}
      - run: terraform apply -input=false tfplan
        working-directory: terraform/environments/${{ inputs.environment }}
