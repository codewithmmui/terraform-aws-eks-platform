name: Terraform Plan
on:
  workflow_call: { inputs: { environment: { required: true, type: string } } }
  workflow_dispatch: { inputs: { environment: { type: choice, required: true, options: [dev, staging, prod] } } }
permissions: { contents: read, id-token: write }
jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.12.2" }
      - uses: aws-actions/configure-aws-credentials@v6
        with: { role-to-assume: "${{ vars.AWS_PLAN_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}", role-session-name: gha-terraform-plan }
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=eks-platform/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
        working-directory: terraform/environments/${{ inputs.environment }}
      - run: printf '%s' '${{ secrets.TF_VARS_JSON }}' > terraform.auto.tfvars.json
        working-directory: terraform/environments/${{ inputs.environment }}
      - run: terraform plan -input=false -no-color -out=tfplan
        working-directory: terraform/environments/${{ inputs.environment }}
      - run: terraform show -no-color tfplan > tfplan.txt
        working-directory: terraform/environments/${{ inputs.environment }}
      - uses: actions/upload-artifact@v4
        with: { name: "tfplan-${{ inputs.environment }}-${{ github.sha }}", path: "terraform/environments/${{ inputs.environment }}/tfplan*", retention-days: 5 }
