name: Security Scan
on: { push: { branches: [main] }, schedule: [{ cron: "17 3 * * 1" }], workflow_dispatch: {} }
permissions: { contents: read, security-events: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: config, scan-ref: ., format: sarif, output: trivy.sarif, severity: "HIGH,CRITICAL" }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }
      - uses: bridgecrewio/checkov-action@master
        with: { directory: ., framework: terraform,kubernetes,github_actions }
