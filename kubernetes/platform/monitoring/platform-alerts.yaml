apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: platform-alerts, namespace: monitoring }
spec:
  groups:
    - name: platform.reliability
      rules:
        - { alert: NodeNotReady, expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0', for: 10m, labels: { severity: critical }, annotations: { summary: Node has been NotReady for 10 minutes } }
        - { alert: HighPodRestartRate, expr: 'increase(kube_pod_container_status_restarts_total[15m]) > 3', for: 10m, labels: { severity: warning }, annotations: { summary: Pod restart rate is sustained } }
        - { alert: DeploymentUnavailable, expr: 'kube_deployment_status_replicas_unavailable > 0', for: 15m, labels: { severity: warning }, annotations: { summary: Deployment has unavailable replicas } }
        - { alert: HighNodeCPU, expr: '1 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9', for: 15m, labels: { severity: warning }, annotations: { summary: Node CPU exceeds 90 percent } }
        - { alert: HighNodeMemory, expr: '1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9', for: 15m, labels: { severity: warning }, annotations: { summary: Node memory exceeds 90 percent } }
        - { alert: PersistentVolumeFilling, expr: 'kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.1', for: 30m, labels: { severity: warning }, annotations: { summary: Persistent volume has less than 10 percent free } }
