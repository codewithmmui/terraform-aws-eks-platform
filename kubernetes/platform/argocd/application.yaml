apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: test-app, namespace: argocd }
spec:
  project: platform-apps
  source: { repoURL: "https://github.com/REPLACE_ORG/terraform-aws-eks-platform.git", targetRevision: main, path: kubernetes/test-app }
  destination: { server: "https://kubernetes.default.svc", namespace: applications }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
