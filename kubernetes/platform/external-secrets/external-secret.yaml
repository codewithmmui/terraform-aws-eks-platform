apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: test-app, namespace: applications }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: test-app-secrets, creationPolicy: Owner }
  data: [{ secretKey: example, remoteRef: { key: eks-platform-dev/test-app, property: example } }]
